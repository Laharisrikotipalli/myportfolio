    <!-- Critical CSS inlined — ALL above-fold styles here to eliminate render-blocking -->
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { scroll-behavior: smooth; font-size: 16px; }
      body {
        font-family: 'DM Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #060b14; color: #e2eaf5;
        overflow-x: hidden; line-height: 1.6;
      }
      :root {
        --bg: #060b14; --bg2: #0d1520; --bg3: #111c2c;
        --card: #0f1d2e; --card2: #152236;
        --border: rgba(0,200,255,0.12); --border-hover: rgba(0,212,255,0.35);
        --cyan: #00d4ff; --cyan2: #00f5c8; --purple: #a78bfa; --pink: #f472b6;
        --text: #e2eaf5; --text2: #8ba8c8; --text3: #6b8fb5;
        --glow: rgba(0,212,255,0.15); --nav-h: 68px;
        --ease: cubic-bezier(0.4,0,0.2,1);
        --shadow-card: 0 4px 30px rgba(0,0,0,0.4);
        --shadow-hover: 0 20px 60px rgba(0,0,0,0.5), 0 0 40px rgba(0,212,255,0.06);
      }
      [data-theme="light"] {
        --bg: #f0f5ff; --bg2: #e8effe; --bg3: #dde6fa;
        --card: #ffffff; --card2: #f4f8ff;
        --border: rgba(79,70,229,0.14); --border-hover: rgba(79,70,229,0.35);
        --cyan: #4338ca; --cyan2: #6d28d9; --purple: #7c3aed; --pink: #be185d;
        --text: #0f172a; --text2: #334155; --text3: #94a3b8;
        --glow: rgba(79,70,229,0.08);
        --shadow-card: 0 4px 20px rgba(0,0,0,0.08);
        --shadow-hover: 0 20px 50px rgba(0,0,0,0.12), 0 0 30px rgba(79,70,229,0.06);
      }
      #root { position: relative; z-index: 1; min-height: 100vh; }
      .container { max-width: 1200px; margin: 0 auto; padding: 0 2rem; }
      #bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
      [data-theme="light"] #bg-canvas { opacity: 0.55; }

      /* ── Scroll reveal base — GPU-only props ── */
      .reveal {
        opacity: 0;
        transform: translateY(28px);
        transition: opacity 0.6s var(--ease), transform 0.6s var(--ease);
        will-change: opacity, transform;
      }
      .reveal.revealed { opacity: 1; transform: translateY(0); will-change: auto; }
      .reveal-left {
        opacity: 0; transform: translateX(-40px);
        transition: opacity 0.7s var(--ease), transform 0.7s var(--ease);
        will-change: opacity, transform;
      }
      .reveal-left.revealed { opacity: 1; transform: translateX(0); will-change: auto; }
      .reveal-right {
        opacity: 0; transform: translateX(40px);
        transition: opacity 0.7s var(--ease), transform 0.7s var(--ease);
        will-change: opacity, transform;
      }
      .reveal-right.revealed { opacity: 1; transform: translateX(0); will-change: auto; }
      .reveal-delay-1 { transition-delay: 0.1s; }
      .reveal-delay-2 { transition-delay: 0.2s; }
      .reveal-delay-3 { transition-delay: 0.3s; }
      .reveal-stagger > * {
        opacity: 0; transform: translateY(12px) scale(0.92);
        transition: opacity 0.35s var(--ease), transform 0.35s var(--ease);
        will-change: opacity, transform;
      }
      .reveal-stagger.revealed > * { opacity: 1; transform: none; will-change: auto; }
      .reveal-stagger.revealed > *:nth-child(1) { transition-delay: 0s; }
      .reveal-stagger.revealed > *:nth-child(2) { transition-delay: 0.06s; }
      .reveal-stagger.revealed > *:nth-child(3) { transition-delay: 0.12s; }
      .reveal-stagger.revealed > *:nth-child(4) { transition-delay: 0.18s; }
      .reveal-stagger.revealed > *:nth-child(5) { transition-delay: 0.24s; }
      .reveal-stagger.revealed > *:nth-child(6) { transition-delay: 0.30s; }
      .reveal-stagger.revealed > *:nth-child(7) { transition-delay: 0.36s; }
      .reveal-stagger.revealed > *:nth-child(8) { transition-delay: 0.42s; }
      .reveal-stagger.revealed > *:nth-child(9) { transition-delay: 0.48s; }
      .reveal-stagger.revealed > *:nth-child(10) { transition-delay: 0.54s; }

      /* Hero items */
      .hero-item { opacity: 0; transform: translateY(22px); transition: opacity 0.6s ease, transform 0.6s ease; }
      .hero-visible { opacity: 1; transform: translateY(0); }

      .skip-link {
        position: absolute; top: -999px; left: 1rem; padding: 8px 16px;
        background: var(--cyan); color: #000; font-weight: 600;
        border-radius: 4px; z-index: 9999; text-decoration: none;
      }
      .skip-link:focus { top: 1rem; }

      @media (max-width: 768px) { .container { padding: 0 1.2rem; } }
      @media (prefers-reduced-motion: reduce) {
        .reveal, .reveal-left, .reveal-right,
        .reveal-stagger > *, .hero-item {
          opacity: 1 !important; transform: none !important;
          transition: none !important; animation: none !important;
        }
        #bg-canvas { display: none !important; }
      }
    </style>
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div id="root"></div>

  </body>
</html>
